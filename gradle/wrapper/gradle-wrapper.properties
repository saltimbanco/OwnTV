distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.8.2-bin.zip
# The wrapper's 10s default read timeout fails CI whenever the Gradle 9.8.2 distribution download
# is slow ("Downloading ... failed: timeout (10000ms)"), which now happens on a runner that only has
# an older distribution cached. 60s plus a retry makes the first download of a bumped wrapper survive
# a slow mirror; it changes nothing once the distribution is cached.
networkTimeout=60000
retries=2
retryBackOffMs=500
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
